apiVersion: v1
kind: Service
metadata:
  name: todo-app-service
  namespace: todo-app
  labels:
    app: todo-app-service
spec:
  type: NodePort  # Use NodePort for local clusters, LoadBalancer for cloud
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
    nodePort: 30000  
  selector:
    app: todo-app

